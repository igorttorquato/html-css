<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <h1>Exemplo de formulário</h1>

    <form action="action.php" method="get" autocomplete="on">

        <p>
            <label for="iano">EM QUE ANO VOCÊ NASCEU? </label>
            <input type="number" name="ano" id="iano" min="1920" max="2025" value="2007" oninput="calcular_Idade()">
        </p>

        <p>
            <label for="iidade">Sua idade é: </label>
            <output id="iidade">18</output>
        </p>

        <p>
            <input type="submit" value="Enviar">   
            <input type="reset" value="Limpar">
        </p>

    </form>

    <script>
        function calcular_Idade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>

</html>
