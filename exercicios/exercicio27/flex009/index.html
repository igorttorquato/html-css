<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.pai {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.filho {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;
        }
    </style>
</head>

<body>
    <div class="pai">
        <div class="filho">A</div>
        <div class="filho">Lorem ipsum dolor sit.
        </div>
        <div class="filho">C</div>
        <div class="filho">Lorem ipsum dolor sit amet consectetur adipisicing elit.</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
        <div class="filho">H</div>
    </div>
</body>

</html>
