<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.pai {
            background-color: lightsalmon;
            flex-flow: row wrap;
            align-items: flex-start;
            display: flex;

            height: 400px;
        }

        div.filho {
            background-color: lightskyblue;
            border: 1px solid black;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="pai">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho" style="align-self: flex-end;">C</div>
        <div class="filho" style="align-self: center;">D</div>
        <div class="filho" style="align-self: stretch;">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
        <div class="filho">H</div>
    </div>
</body>

</html>
