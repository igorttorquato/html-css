<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }

        td, th {
            border: 1px solid black;
            text-align: center;
            padding: 5px;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }

        tbody > tr:nth-child(2n){
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <h1>Uso de tabelas grandes</h1>

    <table>
        <caption>
            Populações de alguns Estados
        </caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Paraíba</td>
                <td>3.974.687</td>
            </tr>
            <tr>
                <td>Pernambuco</td>
                <td>9.058.931</td>
            </tr>
            <tr>
                <td>Rio Grande do Norte</td>
                <td>3.302.729</td>
            </tr>
             <tr>
                <td>Piauí</td>
                <td>3.271.199</td>
            </tr>
            <tr>
                <td>Maranhão</td>
                <td>6.775.152</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td>14.141.626</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total</th>
                <td>X</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
